<dialog id="inspector" class="inspector" aria-labelledby="inspector-title">
  <div class="drawer-toolbar">
    <span class="eyebrow">OBJECT INSPECTOR</span
    ><button id="drawer-close" class="icon-button" aria-label="Close inspector">
      ✕
    </button>
  </div>
  <nav
    id="breadcrumbs"
    class="breadcrumbs"
    aria-label="Object breadcrumb"
  ></nav>
  <div class="drawer-heading">
    <span class="mono" id="inspector-kind"></span>
    <h2 id="inspector-title">Details</h2>
  </div>
  <div id="inspector-body" class="inspector-body"></div>
  <footer class="drawer-footer">
    <span class="mono">SOURCE DATA / READ ONLY</span
    ><a id="full-view" href="#">Full detail view ↗</a>
  </footer>
</dialog>
