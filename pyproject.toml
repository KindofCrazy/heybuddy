[project]
name = "personal-agent"
version = "0.7.0"
description = "A small, explicit personal agent runtime with a handwritten agent loop"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "openai>=2,<3",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
]

[project.scripts]
personal-agent = "personal_agent.main:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
