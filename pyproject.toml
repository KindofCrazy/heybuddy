[project]
name = "personal-agent"
version = "0.7.2"
description = "A small, explicit personal agent runtime with a handwritten agent loop"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "httpx2>=2.16,<3",
    "jinja2>=3.1,<4",
    "jsonschema>=4,<5",
    "markdown-it-py>=3,<5",
    "mcp>=2.3,<3",
    "openai>=2,<3",
    "pillow>=12,<13",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    "pyyaml>=6,<7",
    "uvicorn>=0.34,<1",
    "websockets>=15,<18",
]

[project.scripts]
personal-agent = "personal_agent.main:main"

[project.urls]
Homepage = "https://github.com/KindofCrazy/heybuddy"
Documentation = "https://github.com/KindofCrazy/heybuddy/blob/main/docs/README.md"
Repository = "https://github.com/KindofCrazy/heybuddy"
Issues = "https://github.com/KindofCrazy/heybuddy/issues"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "/src/**",
    "/tests/**",
    "/docs/**",
    "/scripts/**",
    "/evals/**",
    "/README.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/AGENTS.md",
    "/.env.example",
    "/.gitignore",
    "/pyproject.toml",
    "/uv.lock",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
